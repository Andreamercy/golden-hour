name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  test-shared:
    name: Test — Shared Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @golden-hour/shared test

  test-api:
    name: Test — API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: golden_hour
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: golden_hour_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        working-directory: packages/api
        run: pip install -r requirements.txt
      - name: Run API migrations
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql+asyncpg://golden_hour:testpassword@localhost:5432/golden_hour_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_at_least_32_characters_long
        run: alembic upgrade head
      - name: Run API tests
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql+asyncpg://golden_hour:testpassword@localhost:5432/golden_hour_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_at_least_32_characters_long
        run: pytest -v --tb=short

  test-dashboard:
    name: Test — Dashboard (build check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared package first
        run: pnpm --filter @golden-hour/shared build
      - name: Type-check dashboard
        run: pnpm --filter @golden-hour/dashboard typecheck

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-shared, test-api, test-dashboard]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest,ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ghcr.io/${{ github.repository }}/dashboard:latest,ghcr.io/${{ github.repository }}/dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
